name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: vamsurlike_remake/keystore/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androidDebugKey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3 CLI
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Generate debug keystore
        run: |
          mkdir -p vamsurlike_remake/keystore
          keytool -genkeypair \
            -alias androidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore vamsurlike_remake/keystore/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android export templates
        run: |
          wget --tries=3 --timeout=60 -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -o templates.tpz -d /tmp/godot_templates
          find /tmp/godot_templates/templates -type f -exec mv {} ~/.local/share/godot/export_templates/4.3.stable/ \;
          echo "=== Verified export template files ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Android SDK (use pre-installed or install fresh)
        run: |
          CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools"
          
          if [ -f "$CMDLINE_TOOLS/latest/bin/sdkmanager" ]; then
            echo "=== Using pre-installed cmdline-tools ==="
          else
            echo "=== Installing cmdline-tools ==="
            mkdir -p $ANDROID_HOME/cmdline-tools
            rm -rf /tmp/cmdline-tools
            wget --tries=3 --timeout=120 -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -o cmdline-tools.zip -d /tmp
            mv /tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "=== sdkmanager path: $SDKMGR ==="
          ls -la "$SDKMGR" 2>/dev/null || echo "sdkmanager not found!"
          
          # Accept licenses
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          
          # Install required SDK components for Godot 4.3
          "$SDKMGR" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "platform-tools" > /dev/null 2>&1 || true
          
          echo "=== Installed SDK components ==="
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "No ndk"
          echo "=== SDK path: $ANDROID_HOME ==="

      - name: Ensure .godot directory structure
        run: |
          mkdir -p vamsurlike_remake/.godot/editor
          # Create export credentials for headless builds (with [preset.0.options] section)
          echo 'W3ByZXNldC4wXQpbcHJlc2V0LjAub3B0aW9uc10Ka2V5c3RvcmUvZGVidWcva2V5c3RvcmU9InJlczovL2tleXN0b3JlL2RlYnVnLmtleXN0b3JlIgprZXlzdG9yZS9kZWJ1Zy9rZXlzdG9yZV9wYXNzd29yZD0iYW5kcm9pZCIKa2V5c3RvcmUvZGVidWcva2V5X2FsaWFzPSJhbmRyb2lkRGVidWdLZXkiCmtleXN0b3JlL2RlYnVnL2tleV9wYXNzd29yZD0iYW5kcm9pZCIK' | base64 -d > vamsurlike_remake/.godot/editor/export_credentials.cfg

      - name: Import project (initialize editor metadata)
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless \
            --path vamsurlike_remake \
            --import \
            --quit

      - name: Build Android APK (Debug)
        run: |
          mkdir -p build/android
          ./Godot_v4.3-stable_linux.x86_64 --headless \
            --path vamsurlike_remake \
            --verbose \
            --export-debug "Android" \
            build/android/vamsurlike_remake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamsurlike_remake-android-debug
          path: vamsurlike_remake/build/android/vamsurlike_remake.apk
          retention-days: 7
