name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: vamsurlike_remake/keystore/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androidDebugKey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3 CLI
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Generate debug keystore
        run: |
          mkdir -p vamsurlike_remake/keystore
          keytool -genkeypair \
            -alias androidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore vamsurlike_remake/keystore/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android export templates
        run: |
          wget --tries=3 --timeout=60 -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -o templates.tpz -d /tmp/godot_templates
          find /tmp/godot_templates/templates -type f -exec mv {} ~/.local/share/godot/export_templates/4.3.stable/ \;
          echo "=== Verified export template files ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Dump Android SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not set or empty"
          ls -la $ANDROID_SDK_ROOT 2>/dev/null || echo "ANDROID_SDK_ROOT not set or empty"

      - name: Ensure .godot directory structure
        run: |
          mkdir -p vamsurlike_remake/.godot/editor
          # Create export credentials for headless builds (with [preset.0.options] section)
          echo 'W3ByZXNldC4wXQpbcHJlc2V0LjAub3B0aW9uc10Ka2V5c3RvcmUvZGVidWcva2V5c3RvcmU9InJlczovL2tleXN0b3JlL2RlYnVnLmtleXN0b3JlIgprZXlzdG9yZS9kZWJ1Zy9rZXlzdG9yZV9wYXNzd29yZD0iYW5kcm9pZCIKa2V5c3RvcmUvZGVidWcva2V5X2FsaWFzPSJhbmRyb2lkRGVidWdLZXkiCmtleXN0b3JlL2RlYnVnL2tleV9wYXNzd29yZD0iYW5kcm9pZCIK' | base64 -d > vamsurlike_remake/.godot/editor/export_credentials.cfg

      - name: Import project (initialize editor metadata)
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless \
            --path vamsurlike_remake \
            --import \
            --quit

      - name: Build Android APK (Debug)
        run: |
          mkdir -p build/android
          ./Godot_v4.3-stable_linux.x86_64 --headless \
            --path vamsurlike_remake \
            --verbose \
            --export-debug "Android" \
            build/android/vamsurlike_remake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamsurlike_remake-android-debug
          path: vamsurlike_remake/build/android/vamsurlike_remake.apk
          retention-days: 7
