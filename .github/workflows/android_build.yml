name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias androidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore build/android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
        working-directory: ${{ github.workspace }}

      - name: Build Android APK (Debug)
        run: |
          godot --headless \
            --path vamsurlike_remake \
            --export-debug "Android" \
            build/android/vamsurlike_remake.apk
        working-directory: ${{ github.workspace }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamsurlike_remake-android-debug
          path: build/android/vamsurlike_remake.apk
          retention-days: 7
