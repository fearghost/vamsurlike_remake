name: Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3 stable (headless)
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x ./Godot_v4.3-stable_linux.x86_64

      - name: Run headless smoke test
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . -s tests/smoke_test.gd
